# Dependabot proposes a release only once it is 7 days old, so a bad or
# compromised release has time to be pulled or flagged first. Security
# updates skip the wait.
version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"         # pyproject.toml and poetry.lock
      - "/.github"  # tools the workflows install
    schedule:
      interval: "daily"
    assignees:
      - "gauron99"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    # A release inside a range in pyproject.toml only moves poetry.lock.
    # A release outside it raises the range.
    versioning-strategy: "increase-if-necessary"
    groups:
      # Security updates: one pull request for all patch and minor fixes.
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # Version updates: one pull request for all patch and minor bumps.
      pip:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Actions used in the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    assignees:
      - "gauron99"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "knative/actions/*"
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
